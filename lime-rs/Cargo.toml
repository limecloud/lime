[workspace]
members = ["crates/*"]
exclude = [
  "crates/credential",
]
resolver = "2"

[workspace.package]
version = "1.179.0"
edition = "2021"
authors = ["coso"]
repository = "https://github.com/limecloud/lime"
homepage = "https://github.com/limecloud/lime"
license = "GPL-3.0-only"

[workspace.dependencies]
# 项目内 crate 依赖
lime-core = { path = "crates/core" }
lime-config = { path = "crates/config" }
lime-infra = { path = "crates/infra" }
lime-services = { path = "crates/services" }
lime-websocket = { path = "crates/websocket" }
lime-processor = { path = "crates/processor" }
lime-server-utils = { path = "crates/server-utils" }
lime-server = { path = "crates/server" }
lime-skills = { path = "crates/skills" }
lime-mcp = { path = "crates/mcp" }
lime-agent = { path = "crates/agent" }
agent-protocol = { path = "crates/agent-protocol" }
agent-runtime = { path = "crates/agent-runtime" }
model-provider = { path = "crates/model-provider" }
thread-store = { path = "crates/thread-store" }
tool-runtime = { path = "crates/tool-runtime" }
lime-scheduler = { path = "crates/scheduler" }
lime-gateway = { path = "crates/gateway" }
lime-media-runtime = { path = "crates/media-runtime" }
runtime-core = { path = "crates/runtime-core" }
app-server = { path = "crates/app-server" }
app-server-client = { path = "crates/app-server-client" }
app-server-daemon = { path = "crates/app-server-daemon" }
app-server-protocol = { path = "crates/app-server-protocol" }
app-server-test-client = { path = "crates/app-server-test-client" }
app-server-transport = { path = "crates/app-server-transport" }
ansi-escape = { path = "crates/ansi-escape" }
execpolicy = { path = "crates/execpolicy" }
file-search = { path = "crates/file-search" }
lime-utils-absolute-path = { path = "crates/utils-absolute-path" }
lime-utils-path-uri = { path = "crates/utils-path-uri" }
bwrap = { path = "crates/bwrap" }
build-info = { path = "crates/build-info" }
client = { path = "crates/client" }
core-plugin-common = { path = "crates/core-plugin-common" }
exec-server-protocol = { path = "crates/exec-server-protocol" }
exec-server = { path = "crates/exec-server" }
file-system = { path = "crates/file-system" }
file-watcher = { path = "crates/file-watcher" }
guardian-context = { path = "crates/guardian-context" }
hooks = { path = "crates/hooks" }
git-utils = { path = "crates/git-utils" }
install-context = { path = "crates/install-context" }
linux-sandbox = { path = "crates/linux-sandbox" }
model-provider-info = { path = "crates/model-provider-info" }
memories-read = { path = "crates/memories-read" }
mermaid = { path = "crates/mermaid" }
message-history = { path = "crates/message-history" }
mxc-sandbox = { path = "crates/mxc-sandbox" }
network-proxy = { path = "crates/network-proxy" }
otel = { path = "crates/otel" }
protocol = { path = "crates/protocol" }
rollout = { path = "crates/rollout" }
sandboxing = { path = "crates/sandboxing" }
shell-command = { path = "crates/shell-command" }
skills = { path = "crates/skills" }
uds = { path = "crates/uds" }
utils-cargo-bin = { path = "crates/utils-cargo-bin" }
utils-path = { path = "crates/utils-path" }
utils-process = { path = "crates/utils-process" }
utils-pty = { path = "crates/utils-pty" }
websocket-auth = { path = "crates/websocket-auth" }
websocket-client = { path = "crates/websocket-client" }
windows-sandbox = { path = "crates/windows-sandbox" }
api = { path = "crates/api" }
agent-roles = { path = "crates/agent-roles" }
account-provider = { path = "crates/account-provider" }
agent-graph-store = { path = "crates/agent-graph-store" }
agent-identity = { path = "crates/agent-identity" }
apply-patch = { path = "crates/apply-patch" }
async-utils = { path = "crates/async-utils" }
collaboration-mode-templates = { path = "crates/collaboration-mode-templates" }
attachment-store = { path = "crates/attachment-store" }
direct-tool-timing = { path = "crates/direct-tool-timing" }
diagnostics = { path = "crates/diagnostics" }
arg0 = { path = "crates/arg0" }
utils-audio = { path = "crates/utils-audio" }
extension-items = { path = "crates/extension-items" }
http-client = { path = "crates/http-client" }
process-hardening = { path = "crates/process-hardening" }
prompts = { path = "crates/prompts" }
utils-model-facing-id = { path = "crates/utils-model-facing-id" }
utils-cache = { path = "crates/utils-cache" }
utils-cli = { path = "crates/utils-cli" }
utils-image = { path = "crates/utils-image" }
utils-rustls-provider = { path = "crates/utils-rustls-provider" }
utils-home-dir = { path = "crates/utils-home-dir" }
utils-string = { path = "crates/utils-string" }
tcp-tunnel = { path = "crates/tcp-tunnel" }
test-binary-support = { path = "crates/test-binary-support" }
state = { path = "crates/state" }
stdio-to-uds = { path = "crates/stdio-to-uds" }
terminal-detection = { path = "crates/terminal-detection" }
worktree = { path = "crates/worktree" }
plugin-host = { path = "crates/plugin-host" }
plugin = { path = "crates/plugin" }
protocol-test-support = { path = "crates/protocol-test-support" }
history = { path = "crates/history" }
secrets = { path = "crates/secrets" }
keyring-store = { path = "crates/keyring-store" }
utils-critical-path = { path = "crates/utils-critical-path" }
utils-git-discovery = { path = "crates/utils-git-discovery" }
utils-template = { path = "crates/utils-template" }
utils-sleep-inhibitor = { path = "crates/utils-sleep-inhibitor" }
utils-json-to-toml = { path = "crates/utils-json-to-toml" }
utils-plugins = { path = "crates/utils-plugins" }
utils-sandbox-summary = { path = "crates/utils-sandbox-summary" }
utils-fuzzy-match = { path = "crates/utils-fuzzy-match" }
utils-readiness = { path = "crates/utils-readiness" }
utils-approval-presets = { path = "crates/utils-approval-presets" }
utils-output-truncation = { path = "crates/utils-output-truncation" }
utils-head-tail-buffer = { path = "crates/utils-head-tail-buffer" }
utils-elapsed = { path = "crates/utils-elapsed" }
http-headers-helper = { path = "crates/http-headers-helper" }
utils-stream-parser = { path = "crates/utils-stream-parser" }
utils-redacted-string = { path = "crates/utils-redacted-string" }
lime-permissions = { path = "crates/permissions" }
code-mode-protocol = { path = "crates/code-mode-protocol" }
code-mode-runtime = { path = "crates/code-mode-runtime" }
code-mode-host = { path = "crates/code-mode-host" }
code-mode = { path = "crates/code-mode" }
tui = { path = "crates/tui" }
voice-core = { path = "crates/voice-core" }
document-preview = { path = "crates/document-preview" }
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
pretty_assertions = "1"
shlex = "1.3.0"
tree-sitter = "0.25.10"
tree-sitter-bash = "0.25"
tree-sitter-powershell = "=0.26.4"
serde_yaml = { package = "yaml_serde", version = "0.10.4" }
serde_urlencoded = "0.7"

# 异步运行时
tokio = { version = "1.53.3", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = { version = "0.29", features = ["event-stream"] }
deno_core_icudata = "0.77.0"
v8 = { version = "=150.4.0", features = ["v8_enable_sandbox"] }

# 错误处理
anyhow = "1.0.103"
thiserror = "1"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sentry = "0.43"
opentelemetry = "0.27"
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"

# HTTP 服务器
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.9", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "cors", "timeout"] }

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "gzip", "brotli", "deflate"] }
httpdate = "1"

# 数据库
rusqlite = { version = "0.41", features = ["bundled", "backup"] }

# 时间和 UUID
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
email_address = "0.2"
uuid = { version = "1", features = ["v4", "v7"] }

# Cron 调度
cron = "0.15"

# 工具库
dirs = "5"
regex = "1"
pulldown-cmark = { version = "0.10", default-features = false }
semver = "1"
caseless = "0.2.2"
unicode-normalization = "0.1.25"
md5 = "0.7"
jsonwebtoken = "9.3.1"
hmac = "0.12"
urlencoding = "2"
subtle = "2.5"
flate2 = "1"
tar = "0.4.45"
fs2 = "0.4"
indexmap = { version = "2", features = ["serde"] }
zip = { version = "9.4.1", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "time", "zstd"] }
bzip2 = "0.4"
zstd = "0.14.3"
dashmap = "5"
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
parking_lot = "0.12"
tiktoken-rs = "0.6"
webbrowser = "1.0"
base64 = "0.22"
bytes = "1"
rand = "0.8.6"
# 本地凭据只使用 scrypt；此安全修复分支不引入未使用的 HPKE/P-256。
age = "=0.11.5"
keyring = { version = "3.6", default-features = false }
sha2 = "0.10"
open = "5"
url = "2"
once_cell = "1"
arboard = "3"
glob = "0.3.3"
wildmatch = "2.6.1"
hex = "0.4.3"
toml_edit = { version = "0.23.10", features = ["serde"] }
etcetera = "0.11.0"
ignore = "0.4.25"
which = "8.0.0"
scopeguard = "1"
sysinfo = "0.32"
whoami = "1"
jsonschema = "0.30.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
ansi-to-tui = "8.0.1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
textwrap = "0.16.2"

# 音频
cpal = "0.15"

# Code Mode gRPC transport
prost = "0.13.5"
tonic = { version = "0.12.3", features = ["transport"] }
tonic-build = "0.12.3"
protoc-bin-vendored = "3.2.0"

# 终端
portable-pty = "0.9"
vt100 = "0.16.2"

# App Server remote client transport
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }

# SSH
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

# 系统交互
mouse_position = "0.1.4"
window-vibrancy = "0.7.1"
if-addrs = "0.13"
enigo = "0.3"

# MCP (Model Context Protocol)
rmcp = { version = "3.9.0", default-features = false, features = ["auth", "client", "elicitation", "transport-io", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest-native-tls"] }

# 测试
proptest = "1"
tempfile = "3"
sacp = "10.0.0"

# Windows 平台依赖
[workspace.dependencies.windows]
version = "0.56"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
]

[workspace.dependencies.winapi]
version = "0.3"
features = [
    "winuser",
    "winreg",
    "processthreadsapi",
    "handleapi",
    "shellapi",
    "psapi",
    "tlhelp32",
]

[workspace.dependencies.winreg]
version = "0.52"

# macOS 平台依赖
[workspace.dependencies.block]
version = "0.1"

[workspace.dependencies.cocoa]
version = "0.26"

[workspace.dependencies.objc]
version = "0.2"

[workspace.lints]

[workspace.lints.clippy]
uninlined_format_args = "allow"
string_slice = "warn"

[patch.crates-io]
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# 原生资源启动时校验完整 App Server；避免 debug 的软件 SHA 阻塞真实宿主发现。
[profile.dev.package.sha2]
opt-level = 3
