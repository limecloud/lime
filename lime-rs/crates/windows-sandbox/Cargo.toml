[package]
name = "windows-sandbox"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Windows sandbox helpers."

[lib]
name = "windows_sandbox"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
dirs-next = "2.0"
dunce = "1"
glob = "0.3"
http-client = { path = "../http-client" }
lime-otel = { package = "otel", path = "../otel" }
ignore = "0.4"
lime-utils-absolute-path.workspace = true
protocol = { path = "../protocol" }
rand = { version = "0.8", default-features = false, features = ["std", "small_rng"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "signal", "time"] }
tracing.workspace = true
tracing-appender = "0.2"
utils-process = { path = "../utils-process" }
utils-pty = { path = "../utils-pty" }
utils-string = { path = "../utils-string" }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_NetworkManagement_WindowsFirewall", "Win32_System_Com", "Win32_System_Variant"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_SystemServices",
    "Win32_System_Environment",
    "Win32_System_Pipes",
    "Win32_System_WindowsProgramming",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_Security_Cryptography",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Rpc",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Services",
] }
