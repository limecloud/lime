[package]
name = "lime-mcp"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
doctest = false

[dependencies]
lime-core.workspace = true
agent-protocol.workspace = true
tool-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
rmcp.workspace = true
dirs.workspace = true
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "native-tls"] }
axum.workspace = true
chrono.workspace = true
email_address.workspace = true
url.workspace = true
libc = "0.2"

[dev-dependencies]
# In-memory protocol fixtures act as servers; production only enables the client.
rmcp = { workspace = true, features = ["server"] }
futures.workspace = true
tempfile.workspace = true
# Match the CLI/workspace feature graph when testing the real MCP wire.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
