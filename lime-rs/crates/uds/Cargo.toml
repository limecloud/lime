[package]
name = "uds"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cross-platform Unix domain socket helpers."

[lib]
name = "uds"
path = "src/lib.rs"
doctest = false

[dependencies]
tokio = { workspace = true, features = ["fs", "net", "rt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
async-io = "2.6.0"
tokio-util = { workspace = true, features = ["compat"] }
uds_windows = "1.1.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_Networking_WinSock", "Win32_System_IO"] }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "rt-multi-thread"] }
