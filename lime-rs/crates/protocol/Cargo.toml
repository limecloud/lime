[package]
name = "protocol"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Canonical protocol types shared by the Lime runtime."

[lib]
name = "protocol"
path = "src/lib.rs"
doctest = false

[dependencies]
async-utils = { path = "../async-utils" }
chardetng = "0.1.17"
chrono = { workspace = true, features = ["serde"] }
derive_more = { version = "2", features = ["debug"] }
encoding_rs = "0.8.35"
execpolicy = { path = "../execpolicy" }
extension-items = { path = "../extension-items" }
gix-url = "0.40"
globset = "0.4"
http = "1.3.1"
http-client = { path = "../http-client" }
icu_decimal = "2.1"
icu_locale_core = "2.1"
icu_provider = { version = "2.1", features = ["sync"] }
lime-utils-absolute-path.workspace = true
lime-utils-path-uri.workspace = true
network-proxy = { path = "../network-proxy" }
quick-xml = { version = "0.41", features = ["serialize"] }
schemars = "0.8"
serde.workspace = true
serde_json.workspace = true
serde_with = { version = "3.17", features = ["macros", "base64"] }
strum = "0.27"
strum_macros = "0.28"
sys-locale = "0.3"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
ts-rs = { version = "11", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }
utils-image = { path = "../utils-image" }
utils-model-facing-id = { path = "../utils-model-facing-id" }
utils-redacted-string = { path = "../utils-redacted-string" }
utils-string = { path = "../utils-string" }
uuid = { workspace = true, features = ["serde", "v7", "v4"] }
wildmatch = "2.6"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
seccompiler = "0.5"

[dev-dependencies]
anyhow.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
