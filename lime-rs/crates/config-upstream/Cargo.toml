[package]
name = "config"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Codex-aligned configuration loading."

[lib]
name = "config"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
base64.workspace = true
dunce = "1"
execpolicy = { path = "../execpolicy" }
features = { path = "../features" }
file-system = { path = "../file-system" }
futures.workspace = true
gethostname = "1"
git-utils = { path = "../git-utils" }
http-client = { path = "../http-client" }
indexmap = { version = "2", features = ["serde"] }
lime-utils-absolute-path.workspace = true
lime-utils-path-uri.workspace = true
model-provider-info = { path = "../model-provider-info" }
multimap = "0.10"
network-proxy = { path = "../network-proxy" }
prost = "0.14.3"
protocol = { path = "../protocol" }
regex-lite = "0.1"
schemars = "0.8"
serde.workspace = true
serde_ignored = "0.1"
serde_json.workspace = true
serde_path_to_error = "0.1"
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = { version = "0.9", features = ["preserve_order"] }
toml_edit = "0.24"
tonic = { version = "0.14.3", default-features = false, features = ["codegen", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14.3"
tracing.workspace = true
utils-path = { path = "../utils-path" }
utils-redacted-string = { path = "../utils-redacted-string" }
wildmatch = "2.6"

[target.'cfg(unix)'.dependencies]
dns-lookup = "2"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sandbox = { path = "../windows-sandbox" }
winapi-util = "0.1.11"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
winreg = "0.55.0"

[dev-dependencies]
pretty_assertions.workspace = true
tonic = { version = "0.14.3", features = ["server", "router", "transport", "tls-ring"] }
tempfile.workspace = true
test-case = "3.3"
tokio = { workspace = true, features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
