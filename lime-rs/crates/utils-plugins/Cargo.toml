[package]
name = "utils-plugins"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
doctest = false
name = "utils_plugins"
path = "src/lib.rs"

[dependencies]
exec-server = { path = "../exec-server" }
exec-server-protocol = { path = "../exec-server-protocol" }
lime-utils-absolute-path = { path = "../utils-absolute-path" }
lime-utils-path-uri = { path = "../utils-path-uri" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
