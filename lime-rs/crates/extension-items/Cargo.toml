[package]
name = "extension-items"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
name = "extension_items"
path = "src/lib.rs"
doctest = false

[dependencies]
lime-utils-absolute-path = { path = "../utils-absolute-path" }
schemars = "0.8.22"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
ts-rs = { version = "11.0.1", features = ["uuid-impl", "serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
pretty_assertions.workspace = true
