[package]
name = "apply-patch"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Apply patches to files through the executor filesystem."

[lib]
name = "apply_patch"
path = "src/lib.rs"
doctest = false

[dependencies]
anyhow.workspace = true
exec-server = { path = "../exec-server" }
lime-utils-absolute-path.workspace = true
lime-utils-path-uri.workspace = true
similar = "2.7"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[dev-dependencies]
assert_cmd = "2"
assert_matches = "1"
pretty_assertions.workspace = true
tempfile.workspace = true
