[package]
name = "utils-image"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
doctest = false

[dependencies]
base64.workspace = true
image = { version = "^0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
mime_guess = "2.0.5"
png = { version = "0.18.0", features = ["zlib-rs"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread", "macros"] }
utils-cache = { path = "../utils-cache" }
