[package]
name = "otel"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "OpenTelemetry setup for Lime runtime."

[lib]
name = "otel"
path = "src/lib.rs"
doctest = false

[dependencies]
api = { path = "../api" }
bytes.workspace = true
chrono.workspace = true
eventsource-stream = "0.2.3"
gethostname = "1"
http = "1"
http-client = { path = "../http-client" }
http-headers-helper = { path = "../http-headers-helper" }
lime-utils-absolute-path.workspace = true
opentelemetry = { version = "0.31", features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-http = "0.31"
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "http-proto", "http-json", "logs", "metrics", "trace", "reqwest-blocking-client", "reqwest-rustls", "tls", "tls-roots"] }
opentelemetry-semantic-conventions = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["experimental_trace_batch_span_processor_with_async_runtime", "experimental_metrics_custom_reader", "logs", "metrics", "rt-tokio", "testing", "trace"] }
os_info = "3"
protocol = { path = "../protocol" }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
strum_macros = "0.28"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-opentelemetry = "0.32"
tracing-subscriber = "0.3"
utils-process = { path = "../utils-process" }
utils-stream-parser = { path = "../utils-stream-parser" }
utils-string = { path = "../utils-string" }
