[package]
name = "secrets"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Secret storage helpers."

[lib]
name = "secrets"
path = "src/lib.rs"
doctest = false

[dependencies]
age = "=0.11.5"
anyhow.workspace = true
base64.workspace = true
rand = "0.9"
regex = "1.12.3"
schemars = "0.8"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
git-utils = { path = "../git-utils" }
keyring-store = { path = "../keyring-store" }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
keyring = { version = "3.6", default-features = false, features = ["crypto-rust", "apple-native"] }
pretty_assertions.workspace = true
tempfile.workspace = true
