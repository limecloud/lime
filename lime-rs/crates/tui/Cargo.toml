[package]
name = "tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "tui"
path = "src/lib.rs"
doctest = false

[dependencies]
agent-protocol.workspace = true
ansi-escape.workspace = true
anyhow.workspace = true
app-server-client.workspace = true
app-server-protocol.workspace = true
arboard.workspace = true
base64.workspace = true
crossterm = { workspace = true, features = ["bracketed-paste", "event-stream"] }
dirs.workspace = true
futures.workspace = true
image = { version = "0.25.9", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lime-core.workspace = true
rand.workspace = true
ratatui = { workspace = true, features = [
    "scrolling-regions",
    "unstable-backend-writer",
    "unstable-rendered-line-info",
    "unstable-widget-ref",
] }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
shlex = "1"
syntect = "5"
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true, features = ["time"] }
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
two-face = { version = "0.5", default-features = false, features = ["syntect-default-onig"] }
unicode-segmentation.workspace = true
unicode-width.workspace = true
textwrap.workspace = true
url.workspace = true
urlencoding.workspace = true
webbrowser.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }
which.workspace = true
winsplit = "0.1"

[dev-dependencies]
app-server-transport.workspace = true
fs2.workspace = true
portable-pty.workspace = true
pretty_assertions.workspace = true
tokio-tungstenite.workspace = true
tokio = { workspace = true, features = ["test-util"] }
vt100.workspace = true
