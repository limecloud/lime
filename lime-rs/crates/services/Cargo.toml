[package]
name = "lime-services"
version.workspace = true
license.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
local-whisper = ["voice-core/local-whisper"]
local-sensevoice = ["voice-core/local-sensevoice"]

[dependencies]
app-server-protocol.workspace = true
fs2.workspace = true
age.workspace = true
tar.workspace = true
flate2.workspace = true
zstd.workspace = true
# 项目内 crate
lime-core.workspace = true
lime-infra.workspace = true
model-provider.workspace = true
voice-core.workspace = true
document-preview.workspace = true

# 序列化
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# 异步运行时
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio-tungstenite.workspace = true

# 错误处理
thiserror.workspace = true
anyhow.workspace = true

# 日志
tracing.workspace = true

# HTTP 客户端
reqwest.workspace = true

# 时间和 UUID
chrono.workspace = true
uuid.workspace = true

# 工具库
dirs.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
indexmap.workspace = true
glob.workspace = true
sysinfo.workspace = true
whoami.workspace = true
regex.workspace = true
semver.workspace = true
sha2.workspace = true
base64.workspace = true
md5.workspace = true
once_cell.workspace = true
url.workspace = true
urlencoding.workspace = true
zip.workspace = true
tempfile.workspace = true

# 数据库
rusqlite.workspace = true

[dev-dependencies]
proptest.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = ["winbase"] }
winreg.workspace = true
