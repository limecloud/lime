[package]
name = "utils-sleep-inhibitor"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Sleep inhibitor helpers."

[lib]
name = "utils_sleep_inhibitor"
path = "src/lib.rs"
doctest = false

[dependencies]
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading"] }
