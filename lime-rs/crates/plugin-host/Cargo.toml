[package]
name = "plugin-host"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Plugin host process protocol."

[lib]
name = "plugin_host"
path = "src/lib.rs"
doctest = false
test = false

[dependencies]
futures.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "compat", "rt"] }
utils-process = { path = "../utils-process" }
utils-pty = { path = "../utils-pty" }
