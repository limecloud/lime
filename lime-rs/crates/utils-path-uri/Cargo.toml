[package]
name = "lime-utils-path-uri"
version.workspace = true
edition = "2024"
license = "Apache-2.0"
description = "Typed, immutable file: URIs with cross-platform path inspection."

[lib]
doctest = false

[dependencies]
base64 = "0.22"
lime-utils-absolute-path = { workspace = true }
schemars = "0.8.22"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
ts-rs = { version = "11", features = ["no-serde-warnings"] }
url = "2"
urlencoding = "2"

[dev-dependencies]
pretty_assertions = "1"
serde_json = "1"
